<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b4fb3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Zonda Parc Auto</title>
<style>
:root{--bleu:#0b4fb3;--fond:#f4f7fc;--texte:#14213d}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:var(--fond);color:var(--texte);scroll-behavior:smooth}
header{background:var(--bleu);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:18px}
#install{display:none;background:#fff;color:var(--bleu);border:none;border-radius:8px;padding:8px 12px;font-weight:bold;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--bleu),#06316f);color:#fff;padding:36px 16px;text-align:center}
.hero h2{font-size:26px;margin-bottom:8px}
.hero p{opacity:.9;margin-bottom:18px}
.hero .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hero a{padding:12px 20px;border-radius:30px;text-decoration:none;font-weight:bold}
.b1{background:#fff;color:var(--bleu)}.b2{background:#25d366;color:#fff}
.stats{display:flex;justify-content:center;gap:28px;margin-top:22px}
.stats b{display:block;font-size:24px}.stats span{font-size:12px;opacity:.85}
.tools{display:flex;gap:8px;padding:12px;flex-wrap:wrap}
.tools input,.tools select{padding:11px;border:1px solid #ccd6eb;border-radius:10px;font-size:14px;background:#fff}
.tools input{flex:1;min-width:160px}
.chips{display:flex;gap:8px;padding:0 12px 6px;overflow-x:auto}
.chip{background:#fff;border:1px solid var(--bleu);color:var(--bleu);padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;font-size:13px}
.chip.on{background:var(--bleu);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0002;cursor:pointer;transition:.25s;position:relative;opacity:0;transform:translateY(20px);animation:in .5s forwards}
@keyframes in{to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 20px #0003}
.img{height:170px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#dce8fb,#fff);overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;transition:.4s}
.card:hover .img img{transform:scale(1.07)}
.info{padding:12px 14px 14px}
.info h3{font-size:16px}
.sub{font-size:12px;color:#667;margin-top:2px}
.prix{color:var(--bleu);font-weight:bold;font-size:17px;margin:8px 0}
.badge{display:inline-block;font-size:11px;padding:4px 9px;border-radius:10px;color:#fff}
.ok{background:#1a9b4b}.non{background:#c0392b}
.promo{position:absolute;top:10px;left:10px;background:#e63946;color:#fff;font-size:12px;font-weight:bold;padding:5px 10px;border-radius:8px;z-index:2}
.fav{position:absolute;top:8px;right:8px;background:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:17px;cursor:pointer;z-index:2;box-shadow:0 1px 4px #0004}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.open{display:flex}
.box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:94vh;overflow:auto;animation:up .3s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.box .img{height:230px}
.thumbs{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}
.thumbs img.on{border-color:var(--bleu)}
.box .info{padding:16px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.btn{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;font-weight:bold;margin-top:10px;border:none;width:100%;font-size:15px;cursor:pointer}
.wa{background:#25d366;color:#fff}.fermer{background:#e8eefa;color:var(--bleu)}.part{background:#fff;border:1px solid var(--bleu);color:var(--bleu)}
.flot{position:fixed;right:14px;bottom:14px;background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 4px 12px #0005;z-index:6}
footer{text-align:center;padding:24px 16px 80px;font-size:13px}
footer a{color:var(--bleu);margin:0 8px;text-decoration:none;font-weight:bold}
.vide{text-align:center;padding:30px;color:#777}
</style>
</head>
<body>

<header>
  <h1 id="nomParc"></h1>
  <button id="install">📲 Installer l'app</button>
</header>

<section class="hero">
  <h2>Trouvez votre véhicule idéal</h2>
  <p>Stock mis à jour en temps réel • Conakry, Guinée</p>
  <div class="btns">
    <a class="b1" href="#stock">Voir le stock</a>
    <a class="b2" id="heroWa" target="_blank">💬 WhatsApp</a>
  </div>
  <div class="stats">
    <div><b id="sDispo">0</b><span>Disponibles</span></div>
    <div><b id="sPromo">0</b><span>En promo</span></div>
    <div><b id="sTotal">0</b><span>Au catalogue</span></div>
  </div>
</section>

<div class="tools" id="stock">
  <input id="recherche" placeholder="🔍 Rechercher (ex : Land Cruiser)">
  <select id="tri">
    <option value="">Trier par</option>
    <option value="asc">Prix croissant</option>
    <option value="desc">Prix décroissant</option>
    <option value="annee">Plus récent</option>
  </select>
</div>
<div class="chips" id="chips"></div>
<div class="grid" id="grille"></div>

<div class="modal" id="modal"><div class="box" id="box"></div></div>
<a class="flot" id="flot" target="_blank">💬</a>
<footer id="pied"></footer>

<script>
/* ===== CONFIGURATION (à changer pour chaque client) ===== */
const CONFIG = {
  nom: "Zonda Parc Auto",
  whatsapp: "224600000000",
  facebook: "https://facebook.com/",
  instagram: "https://instagram.com/",
  tiktok: "https://tiktok.com/",
  afficherPrix: true,
  couleurPrincipale: "#0b4fb3",
  sheetCSV: "https://script.google.com/macros/s/AKfycbzpDZDzMlUqLBl5kzF82dR97C7Dz8zBCGYa6Lu8ihrpdE9eZZhtuJHjHGbuX_1zvKMw/exec"
};

/* ===== STOCK D'EXEMPLE (utilisé si le Sheet est vide) ===== */
let voitures = [
  {nom:"Toyota Land Cruiser LC300",type:"SUV",prix:850000000,couleur:"Blanc",annee:2025,dispo:"oui",promo:"-5%",description:"V6 biturbo, cuir, toit ouvrant, 7 places.",images:[]},
  {nom:"Toyota Land Cruiser 2026",type:"SUV",prix:920000000,couleur:"Noir",annee:2026,dispo:"oui",promo:"Nouveau",description:"Dernier modèle, full options, caméra 360.",images:[]},
  {nom:"Toyota Hilux Double Cabine",type:"Pick-up",prix:380000000,couleur:"Gris",annee:2025,dispo:"oui",promo:"",description:"4x4 diesel robuste, idéal route et chantier.",images:[]},
  {nom:"Toyota Land Cruiser Prado",type:"SUV",prix:620000000,couleur:"Bleu",annee:2024,dispo:"non",promo:"",description:"Confortable, 7 places, très bon état.",images:[]},
  {nom:"Toyota Corolla",type:"Berline",prix:210000000,couleur:"Argent",annee:2024,dispo:"oui",promo:"-8%",description:"Économique, climatisation, automatique.",images:[]},
  {nom:"Toyota Fortuner",type:"SUV",prix:470000000,couleur:"Blanc",annee:2025,dispo:"oui",promo:"",description:"SUV familial puissant, 4x4.",images:[]}
];

const COUL = {Blanc:"#f2f2f2",Noir:"#222",Gris:"#888",Bleu:"#1b5fd1",Argent:"#c0c4cc",Rouge:"#c0392b",Vert:"#2e7d32",Beige:"#d9c7a0"};
let filtre="Tous", texte="", tri="";
let favs = [];
try{ favs = JSON.parse(localStorage.getItem("favs")||"[]"); }catch(e){ favs = []; }

document.documentElement.style.setProperty("--bleu", CONFIG.couleurPrincipale);
document.getElementById("nomParc").textContent = CONFIG.nom;
document.title = CONFIG.nom;
const waLien = "https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("Bonjour, je souhaite des informations sur vos véhicules.");
document.getElementById("heroWa").href = waLien;
document.getElementById("flot").href = waLien;

const gnf = n => Number(n).toLocaleString("fr-FR")+" GNF";
const prixTxt = v => CONFIG.afficherPrix ? gnf(v.prix) : "Prix sur demande";

function svg(v){
  const c = COUL[v.couleur]||"#0b4fb3";
  let corps;
  if(v.type==="Pick-up") corps='<path d="M12 70 L14 52 Q16 46 26 44 L52 40 L66 22 Q70 18 78 18 L104 18 Q110 18 114 24 L122 40 L192 40 L192 70 Z"/><polygon points="70,40 78,24 104,24 112,40" fill="#cfe3ff" stroke="none"/>';
  else if(v.type==="Berline") corps='<path d="M10 70 L14 54 Q16 48 28 46 L60 42 L84 24 Q90 20 98 20 L132 20 Q140 20 148 30 L162 44 L184 48 Q194 52 194 62 L194 70 Z"/><polygon points="88,42 96,26 130,26 144,42" fill="#cfe3ff" stroke="none"/>';
  else corps='<path d="M12 70 L16 50 Q18 42 28 40 L60 36 L78 20 Q82 16 90 16 L132 16 Q140 16 146 24 L160 40 L182 46 Q192 50 192 60 L192 70 Z"/><polygon points="84,36 92,22 130,22 142,36" fill="#cfe3ff" stroke="none"/>';
  return `<svg width="210" height="105" viewBox="0 0 205 100"><g fill="${c}" stroke="#14213d" stroke-width="2.5">${corps}</g>
  <circle cx="48" cy="72" r="14" fill="#14213d"/><circle cx="150" cy="72" r="14" fill="#14213d"/>
  <circle cx="48" cy="72" r="5" fill="#ccc"/><circle cx="150" cy="72" r="5" fill="#ccc"/></svg>`;
}
const vis = (v,i=0) => v.images && v.images[i] ? `<img src="${v.images[i]}" alt="${v.nom}" onerror="this.outerHTML=''">` : svg(v);

function dessiner(){
  const types=["Tous","Disponible","Promos","Favoris ❤️",...new Set(voitures.map(v=>v.type))];
  document.getElementById("chips").innerHTML = types.map(t=>`<div class="chip ${t===filtre?"on":""}" onclick="setFiltre('${t}')">${t}</div>`).join("");

  let liste = voitures.map((v,i)=>({...v,i})).filter(v=>{
    let ok = filtre==="Tous" ? true : filtre==="Disponible" ? v.dispo==="oui" : filtre==="Promos" ? !!v.promo : filtre==="Favoris ❤️" ? favs.includes(v.nom) : v.type===filtre;
    return ok && v.nom.toLowerCase().includes(texte.toLowerCase());
  });
  if(tri==="asc") liste.sort((a,b)=>a.prix-b.prix);
  if(tri==="desc") liste.sort((a,b)=>b.prix-a.prix);
  if(tri==="annee") liste.sort((a,b)=>b.annee-a.annee);

  document.getElementById("grille").innerHTML = liste.length ? liste.map((v,k)=>`
    <div class="card" style="animation-delay:${k*60}ms" onclick="ouvrir(${v.i})">
      ${v.promo?`<div class="promo">${v.promo}</div>`:""}
      <button class="fav" onclick="event.stopPropagation();basculerFav(${v.i})">${favs.includes(v.nom)?"❤️":"🤍"}</button>
      <div class="img">${vis(v)}</div>
      <div class="info">
        <h3>${v.nom}</h3>
        <div class="sub">${v.annee} • ${v.couleur} • ${v.type}</div>
        <div class="prix">${prixTxt(v)}</div>
        <span class="badge ${v.dispo==="oui"?"ok":"non"}">${v.dispo==="oui"?"Disponible":"Vendu"}</span>
      </div>
    </div>`).join("") : `<div class="vide">Aucun véhicule trouvé.</div>`;

  document.getElementById("sDispo").textContent = voitures.filter(v=>v.dispo==="oui").length;
  document.getElementById("sPromo").textContent = voitures.filter(v=>v.promo).length;
  document.getElementById("sTotal").textContent = voitures.length;
}

function setFiltre(t){filtre=t;dessiner()}
function basculerFav(i){
  const n=voitures[i].nom;
  favs = favs.includes(n) ? favs.filter(x=>x!==n) : [...favs,n];
  try{ localStorage.setItem("favs",JSON.stringify(favs)); }catch(e){}
  dessiner();
}
document.getElementById("recherche").oninput=e=>{texte=e.target.value;dessiner()};
document.getElementById("tri").onchange=e=>{tri=e.target.value;dessiner()};

function photo(i,k){
  const v=voitures[i];
  document.getElementById("grand").innerHTML = vis(v,k);
  document.querySelectorAll(".thumbs img").forEach((el,n)=>el.classList.toggle("on",n===k));
}
function ouvrir(i){
  const v=voitures[i];
  const msg=encodeURIComponent(`Bonjour, je suis intéressé par : ${v.nom} (${v.annee}). Est-il toujours disponible ?`);
  const thumbs = v.images && v.images.length>1 ? `<div class="thumbs">${v.images.map((im,k)=>`<img src="${im}" class="${k===0?"on":""}" onclick="photo(${i},${k})">`).join("")}</div>` : "";
  document.getElementById("box").innerHTML=`
    <div class="img" id="grand">${vis(v)}</div>${thumbs}
    <div class="info">
      <h2>${v.nom}</h2>
      <div class="prix" style="font-size:22px">${prixTxt(v)} ${v.promo?`<span class="badge" style="background:#e63946">${v.promo}</span>`:""}</div>
      <div class="row"><span>Année</span><b>${v.annee}</b></div>
      <div class="row"><span>Couleur</span><b>${v.couleur}</b></div>
      <div class="row"><span>Type</span><b>${v.type}</b></div>
      <div class="row"><span>Disponibilité</span><b>${v.dispo==="oui"?"Disponible":"Vendu"}</b></div>
      <p style="margin-top:10px;font-size:14px;line-height:1.5">${v.description}</p>
      <a class="btn wa" href="https://wa.me/${CONFIG.whatsapp}?text=${msg}" target="_blank">💬 Je suis intéressé</a>
      <button class="btn part" onclick="partager(${i})">🔗 Partager</button>
      <button class="btn fermer" onclick="fermer()">Fermer</button>
    </div>`;
  document.getElementById("modal").classList.add("open");
}
function partager(i){
  const v=voitures[i];
  const t=`${v.nom} - ${prixTxt(v)} chez ${CONFIG.nom}`;
  if(navigator.share) navigator.share({title:CONFIG.nom,text:t,url:location.href});
  else window.open("https://wa.me/?text="+encodeURIComponent(t+" "+location.href));
}
function fermer(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")fermer()};

document.getElementById("pied").innerHTML=`
  <div>Suivez-nous :
  <a href="${CONFIG.facebook}" target="_blank">Facebook</a>
  <a href="${CONFIG.instagram}" target="_blank">Instagram</a>
  <a href="${CONFIG.tiktok}" target="_blank">TikTok</a></div>
  <p style="margin-top:8px;opacity:.6">© ${CONFIG.nom}</p>`;

/* ===== Lecture du Google Sheet ===== */
function lireCSV(t){
  const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if(ch=='"') q=true;
    else if(ch==','){r.push(c);c=""}
    else if(ch=='\n'||ch=='\r'){ if(ch=='\r'&&t[i+1]=='\n')i++; r.push(c);rows.push(r);r=[];c="" }
    else c+=ch;
  }
  if(c||r.length){r.push(c);rows.push(r)}
  return rows;
}
async function chargerSheet(){
  if(!CONFIG.sheetCSV) return;
  try{
    const rows=lireCSV(await (await fetch(CONFIG.sheetCSV)).text());
    const h=rows[0].map(x=>x.trim().toLowerCase());
    const g=(r,n)=>(r[h.indexOf(n)]||"").trim();
    const data=rows.slice(1).filter(r=>g(r,"nom")).map(r=>({
      nom:g(r,"nom"),type:g(r,"type"),prix:g(r,"prix").replace(/\s/g,""),couleur:g(r,"couleur"),
      annee:g(r,"annee"),dispo:g(r,"dispo").toLowerCase(),promo:g(r,"promo"),
      description:g(r,"description"),images:g(r,"images")?g(r,"images").split("|").map(s=>s.trim()):[]
    }));
    if(data.length) voitures=data;
  }catch(e){console.log("Sheet indisponible")}
}

/* ===== Installation en application ===== */
let pwa;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();pwa=e;document.getElementById("install").style.display="block"});
document.getElementById("install").onclick=()=>{if(pwa){pwa.prompt();pwa=null;document.getElementById("install").style.display="none"}};
if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js");

dessiner();
chargerSheet().then(dessiner);
</script>
</body>
</html>
